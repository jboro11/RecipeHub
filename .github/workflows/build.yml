name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore RecipeHub.sln
      - run: dotnet build RecipeHub.sln --configuration Release --no-restore
      - run: dotnet test RecipeHub.sln --configuration Release --no-build
